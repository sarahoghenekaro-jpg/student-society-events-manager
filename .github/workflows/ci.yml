name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:devpassword@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Debug dependencies
        run: |
          node -v
          npm -v
          ls -l node_modules/.bin/node-pg-migrate || true
          ls -l node_modules/node-pg-migrate/bin/ || true

      - name: Run lint
        run: npm run lint

      - name: Run database migrations
        run: node ./node_modules/node-pg-migrate/bin/node-pg-migrate.js up

      - name: Run tests
        run: npm test